server:
  port: 8082

spring:
  application:
    name: server-test
  # 独立联调模式: 启动时执行建表脚本(幂等, IF NOT EXISTS)
  sql:
    init:
      mode: always
      # V1.0 全量 DDL 已包含全部列（含主机延迟检测与 ms_proxy.create_by），无独立增量脚本
      schema-locations: classpath:db/init/V1.0__init_server.sql
  datasource:
    url: jdbc:h2:mem:serverdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.chua.starter.server.support.entity
  configuration:
    map-underscore-to-camel-case: true

plugin:
  api:
    request-decode:
      enable: false

# 服务器资产模块配置
server.support:
  # guacd 守护进程地址——已部署 172.16.0.40:14822（Docker 容器 guacamole/guacd）
  # 运行时可在系统配置页（系统配置 → Guacd）动态修改
  guacd:
    host: 172.16.0.40
    port: 14822
    # guacd-client 网关：浏览器侧 guacamole 客户端回连后端 WS 隧道的 host:port（空串=同域 location.host）
    client-host: 127.0.0.1:8082
  # 凭据加密密钥(生产环境必须通过环境变量覆盖)
  credential-key: ${SERVER_SUPPORT_CREDENTIAL_KEY:dev-only-credential-key}
  # 会话空闲超时(分钟)
  session-idle-minutes: 30
  # 批量执行并发度
  exec-concurrency: 16

logging:
  level:
    com.chua.starter.server.support: debug
