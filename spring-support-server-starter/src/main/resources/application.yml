server:
  port: 8082

spring:
  application:
    name: server-test
  # 独立联调模式: 启动时执行建表脚本(幂等, IF NOT EXISTS)
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init/V1.0__init_server.sql
  datasource:
    url: jdbc:h2:mem:serverdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.chua.starter.server.support.entity
  configuration:
    map-underscore-to-camel-case: true

plugin:
  api:
    request-decode:
      enable: false

# 服务器资产模块配置
server.support:
  # guacd 守护进程地址(参考 scripts/install-guacd.sh 部署)
  guacd:
    host: 127.0.0.1
    port: 4822
  # 凭据加密密钥(生产环境必须通过环境变量覆盖)
  credential-key: ${SERVER_SUPPORT_CREDENTIAL_KEY:dev-only-credential-key}
  # 会话空闲超时(分钟)
  session-idle-minutes: 30
  # 批量执行并发度
  exec-concurrency: 16

logging:
  level:
    com.chua.starter.server.support: debug
