spring:
  application:
    name: server-starter
  main:
    allow-circular-references: true
  ai:
    rag:
      enabled: false
  autoconfigure:
    exclude:
      - com.chua.starter.ai.support.configuration.RagAutoConfiguration
  datasource:
    url: jdbc:h2:mem:serverdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
    script:
      continue-on-error: true
      ignore-failed-drops: true

plugin:
  redis:
    server:
      enable: false
