server:
  port: 9998

plugin:
  datasync:
    enabled: true
    mapping-source: database
    database-mapping:
      enabled: true
      table-prefix: datasync_
      auto-init-table: true
      cron: "0/5 * * * * ?"

spring:
  datasource:
    url: jdbc:h2:mem:testdb-datasync
    username: sa
    password:
  h2:
    console:
      enabled: true

logging:
  level:
    com.chua.starter.datasync: DEBUG
    com.chua.chronicle.support.dispatcher: DEBUG
