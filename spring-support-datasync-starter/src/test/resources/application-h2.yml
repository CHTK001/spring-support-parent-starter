server:
  port: 9998

plugin:
  datasync:
    enabled: true
    mapping-source: database
    database-mapping:
      enabled: true
      table-prefix: datasync_

spring:
  datasource:
    url: jdbc:h2:mem:testdb-datasync;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

logging:
  level:
    com.chua.starter.datasync: DEBUG
    com.chua.chronicle.support.dispatcher: DEBUG
