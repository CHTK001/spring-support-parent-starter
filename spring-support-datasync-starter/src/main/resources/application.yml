server:
  port: 0

plugin:
  datasync:
    enabled: true
    file-mapping:
      directory-path: ./src/main/resources/datasync/mappings
  # P3/P5 门控：保持 datasync 宿主既有 OSGi 服务器设施行为（该门控默认已改为关闭）
  osgi:
    server:
      enabled: true

spring:
  application:
    name: datasync-starter-test
  sql:
    init:
      mode: never

logging:
  level:
    com.chua.starter.datasync: DEBUG
