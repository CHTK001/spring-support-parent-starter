spring.application.name=lowcode-it

# H2 内存库 + MySQL 模式：本模块 DDL 用的是 MySQL 语法（COMMENT / ENGINE / ON DUPLICATE KEY UPDATE）
spring.datasource.url=jdbc:h2:mem:lowcode_it;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 建表脚本由本测试显式执行（不让框架的脚本运行器介入，避免与其他模块的脚本通道耦合）
spring.sql.init.mode=never

# 关闭无关重模块，测试只关心低代码自身的装配与业务语义
plugin.mybatis.data.scope.enable=false
plugin.oauth.enable=false
plugin.osgi.enabled=false
plugin.lowcode.enable=true

logging.level.com.chua.starter.lowcode=INFO
