# 爬虫中心示例配置
# 复制到宿主应用 application.yml 后按需修改
server:
  port: 18171

spring:
  application:
    name: spider-center
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.16.0.40:3306/spider?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root@

# 爬虫模块开关（默认开启）
spider:
  enable: true
  path: /spider

# 多级缓存：启用列表走 Caffeine 缓存，防止定时调度每秒查询数据库
plugin:
  cache:
    enabled: true
    levels:
      - caffeine
    caffeine:
      maximum-size: 10000
      expire-after-write: 10
      record-stats: true
    key:
      with-tenant: false
      with-application: false
      with-platform: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: AUTO
  mapper-locations: classpath*:mapper/**/*.xml
