# ============================================================
# 本地开发覆盖配置（untracked，不提交、不影响他人）
# ============================================================
# 用途：spring-support-monitor-starter 根 application.yml（已提交）的
#       datasource / redis / influxdb / guacd 均指向远程端点
#      （172.16.0.40:3306、172.16.0.40:8086、124.221.230.112:4822），
#       本机不可达导致裸 java -jar 无法启动。
# 本文件把关键端点全覆盖为本机服务，只在本机生效。
#
# 用法（工作目录 = spring-support-monitor-starter）：
#   java -jar target/spring-support-monitor-starter-4.0.0.51-exec.jar --spring.profiles.active=local
#
# 依赖本机服务：
#   - MySQL 127.0.0.1:3306 数据库 monitordb（root 无密码）
#   - Redis  127.0.0.1:6379
# ============================================================

server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/monitordb?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ""
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  threads:
    virtual:
      enabled: false

plugin:
  socket:
    room:
      - client-id: default
        context-path: /socket.io
        port: 29612
  sync:
    server:
      port: 19384
  monitor:
    agent:
      tcp-port: 19392

control:
  webrtc:
    enabled: false

apm:
  enabled: false

skywalking:
  enabled: false