# ===========================================
# 生产环境覆盖配置（--spring.profiles.active=prod）
# ===========================================
# 这个 profile 存在的唯一理由：把「本地联调免鉴权」与「生产必须鉴权」之间的
# 缺口变成 fail-safe，而不是靠人记得改配置。
#
# 默认 application.yml 里写着（注释也自认是本地联调用）：
#   plugin.oauth.enable: false
#   plugin.oauth.whitelist: [/ms/**]
# 实测在该配置下，任何能连到服务端口的人都可以**无凭据**创建 / 启动 / 停止 / 删除
# 服务节点，而节点能拉起任意协议服务器（代理节点可指向内网地址，文件存储节点可指定
# 读取根路径）。此前没有任何机制阻止这份「本地便利」配置被原样带到生产。
#
# require-auth=true 会装配 ProductionAuthGuard：启动期逐条检查鉴权是否被绕过
# （enable=false / local-admin-fallback=true / 白名单覆盖 /ms），
# 只要发现任何一条就拒绝启动并打印全部原因，而不是等出事才发现。
#
# ------------------------------------------------------------------
# 为什么 protocol 用 static 而不是 tcp（2026-10-03 实测后修正）
# ------------------------------------------------------------------
# 本文件此前写的是 protocol 走默认 tcp，并注明「auth-address 留空会导致登录不可用」，
# 隐含前提是「鉴权必须有一个外部服务」。**这个前提经查证不成立**：
#
#   oauth-client-starter 里 StaticProtocol（@Spi("Static")）是完整的本地实现 ——
#   TokenCipher 用内置 SM4 密钥对用户信息加解密、StaticSessionRegistry 维护本地会话、
#   StaticUserStore 校验静态凭据。**全程不发起任何远程调用**。
#
# 而 tcp 走 TcpProtocol，必须有一个 address 指向的鉴权服务在线。
# 本仓当前并没有部署这样的服务，实测 Kali 上 9848/9849/19180/19181/19182/19185/
# 19380/19390 无一响应，9848 与 9849 是 java 进程但并非鉴权服务。
# 也就是说：按 tcp 部署的结果不是「更安全」，而是**没有人能登录** ——
# 把「任何人可写」换成「谁也用不了」，这不是可接受的生产状态。
#
# 因此生产默认走 static：凭据由 plugin.oauth.temp.user 提供，密钥内置，
# 不依赖任何外部服务即可完成鉴权。**若将来真的部署了统一鉴权服务，
# 改成 protocol: tcp 并填 auth-address 即可，无需改动其他项。**
#
# ------------------------------------------------------------------
# 上线前必须做的事（否则启动即失败，这是有意为之）
# ------------------------------------------------------------------
# 必须设置 OAUTH_TEMP_USER，格式为「用户名:密码」或「用户名:<盐>$<摘要>」，
# 多个账号用分号分隔。**没设置就启动会失败** —— 由 ProductionAuthGuard 判定，
# 属于刻意的 fail-safe：宁可启动失败让人来配，也不要出现「服务起来了、
# 鉴权也标着启用、但没有任何账号能登录」这种要等用户投诉才发现的状态。
# 生成加盐摘要（**不是 openssl passwd**）：
#   格式必须是 <32位十六进制盐>$<32位十六进制摘要>，摘要 = MD5(盐 + 明文口令)，
#   由 com.chua.starter.oauth.client.support.user.SaltedPassword 校验。
#   openssl passwd -apr1 产出的 $apr1$<盐>$<哈希> **不被识别** —— 它既不是明文，
#   也不满足定长十六进制校验，于是永远匹配不上：服务能正常启动、配置上也标着
#   「已启用鉴权」，但没有任何账号能登录。此前本文件给出的正是这条命令，
#   照做就会踩进这个坑；ProductionAuthGuard 现已改为逐条校验格式并在启动期拒绝。
#
#   正确生成方式（任选其一）：
#   1) 直接用明文（StaticUserStore 明确支持，最省事）：
#        export OAUTH_TEMP_USER="admin:<明文口令>"
#   2) 用加盐摘要（避免配置泄露即口令曝光）：
#        SALT=$(openssl rand -hex 16)                 # 恰好 32 位十六进制
#        DIGEST=$(printf '%s' "${SALT}<明文口令>" | openssl dgst -md5 -hex | awk '{print $NF}')
#        export OAUTH_TEMP_USER="admin:${SALT}\$${DIGEST}"
#
#   多个账号用分号分隔：export OAUTH_TEMP_USER="admin:<口令>;ops:<口令>"

plugin:
  oauth:
    # 打开 fail-safe 守卫（本地联调不启用，故对现有行为零影响）
    require-auth: true
    # 生产必须启用鉴权
    enable: true
    # 不允许「取不到用户上下文就按本地 admin 放行」——该兜底等价于绕过鉴权
    local-admin-fallback: false
    # 本地验签，不依赖任何外部鉴权服务（依据见上方说明）
    protocol: static
    # 静态账号。为空时**不会**静默放行任何空口令账号 —— ProductionAuthGuard 会
    # 检测到「protocol=static 却没有账号」并拒绝启动（见 detectUnusableConfigs）。
    # 这样配置缺失在启动期就暴露，而不是等真实用户发现「所有人都登不进去」。
    temp:
      user: ${OAUTH_TEMP_USER:}
    # 静态 token 有效期。24h 偏长：服务管理属于管理面操作，
    # 缩短到 2h 让泄露的 token 更难被利用；配合重新登录成本可接受。
    static-token-expire-seconds: 7200
    # 不放行任何 /ms 路径。此处只放行「登录页/登录态落地前」必须无凭据拉取的默认配置，
    # 其余服务管理接口全部需要凭据。
    # 已核对 AuthClientProperties.DEFAULT_WHITELIST：其中不含 /ms，也不含 /v2/setting/default，
    # 所以开 enable=true 后管理接口确实会被保护；/v2/setting/default 属登录流程必需，
    # 必须显式放行（同 eduai 先例），否则登录页挂载即 403、前端误判登录失效弹回登录页。
    whitelist:
      - /v2/setting/default
  file-storage:
    # 文件服务器私有桶保持开启：enable=false 或留空时按公共桶运行，
    # 目录列表与文件内容将对能连到端口的人可读
    private-buckets: localFileStorage