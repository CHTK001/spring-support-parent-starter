server:
  port: 8081

spring:
  application:
    name: monitor-test
  autoconfigure:
    exclude:
      - com.chua.metrics.support.MetricsAutoConfiguration
      - com.chua.starter.ai.support.configuration.RagAutoConfiguration

  datasource:
    url: jdbc:h2:mem:monitordb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.chua.starter.monitor.support.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.chua.starter.monitor.support: debug
