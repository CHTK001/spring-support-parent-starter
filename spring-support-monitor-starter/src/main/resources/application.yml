server:
  port: 8082

spring:
  application:
    name: monitor-test
  autoconfigure:
    exclude:
      # filesystem-starter 自带的 web 分片上传链(auto-config 引用 monitor 未装配的 Service/Controller Bean), 排除之;
      # 我们只需其 FileStorageServerFilter/Setting/LocalFileStorage 类(file-storage 插件反射加载)
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
      # redis-starter 的 RedisConfiguration 在 Spring Boot 4 下出现 RedisProperties 重复注册冲突，本地联调排除
      - com.chua.starter.redis.support.RedisConfiguration
      # crypto-starter 密钥块完整性校验需口令，本地联调无密钥环境排除
      - com.chua.crypto.support.spring.CryptoAutoConfiguration
      # job-starter 依赖 JobMapper（mybatis 表映射），monitor 本地联调无该表排除
      # 改为显式管理：V2.0__init_all_job.sql 已在 report 库建表（_version=V2.0__init_all_job）
      # - com.chua.starter.job.support.JobAutoConfiguration

  # ===========================================
  # CDP 调试中心（spring-support-cdp-starter，monitor 的依赖）
  # ===========================================
  # 刻意写在这里而不是靠命令行：CDP 是 monitor 能力的一部分，不是外挂进程。
  # monitor 启动时 CdpAutoConfiguration 自动装配（pom 已依赖该 starter），
  # 于是同一进程内同时提供：
  #   REST      /ms/cdp/**   （状态 / 目标 / DOM / 截屏 / 求值）
  #   WebSocket /ws/cdp      （前端 pages/debug 的实时通道）
  # 前端只需把 /ms/cdp 与 /ws/cdp 代理到本服务端口（dev 下 MS_API_TARGET 指向这里）。
  #
  # enabled=false 时整块能力关闭（Controller 仍注册，但不会拉起浏览器）。
  cdp:
    enabled: true
    # Chromium 调试端口（宿主机 127.0.0.1:端口 承载 DevTools HTTP + WS）
    port: 9222
    # 无头启动：服务器上没有显示器时唯一可用形态
    headless: true
    # 前端实时通道路径，须与 pages/debug 的 CDP_WS_PATH 一致
    ws-path: /ws/cdp

  ai:
    generate:
      enabled: false

  # 上传上限：PCAP 分析要整份导入抓包文件，Spring 默认上限 1MB —— 连一个几百包的 pcap 都装不下，
  # 会在进入 Controller 之前就抛 MaxUploadSizeExceededException（前端只看到 500，看不出原因）。
  # 这里放开到 2GB；前端导入前也会做一次大小校验，两处阈值要保持一致。
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 2048MB

  # 建表脚本：统一由 datasource-starter 的 FlywayLike 机制执行（plugin.datasource.script）。
  # 之前走 spring.sql.init，需要逐个列举 schema-locations / data-locations：
  #   - 漏列就静默不执行（曾导致 ms_monitor_config / ms_monitor_alarm_policy 空表）
  #   - 依赖 jar 里的脚本（如 device-starter 的 db/init）路径难写
  #   - 版本化 / 幂等 / 补列全靠手写约定
  # FlywayLike 直接扫 classpath*:db/init/*.sql，各模块 jar 里的脚本自动纳入，
  # 且按「脚本名+版本」在 sys_database_version 记账，天然只跑一次。
  sql:
    init:
      mode: never

  datasource:
    url: jdbc:mysql://172.16.0.40:3306/report?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MONITOR_DB_PASSWORD:}

  # Redis（告警静默期 + 可选时序引擎 plugin.monitor.timeseries.engine=redis）
  data:
    redis:
      host: 172.16.0.40
      port: 6379
      # password: xxx
      timeout: 3s

  # guacd 远控隧道：本地 8082 连接 8080 服务器上的 guacd（124.221.230.112:4822 已开放）
  support:
    guacd:
      host: 124.221.230.112
      port: 4822
      # 浏览器回连本机的 WS 隧道端点（guacamole 客户端 -> 8082 /ws/ms/server/terminal）
      client-host: 127.0.0.1:8848

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.chua.starter.monitor.support.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境关闭 SQL/结果全量打印（StdOutImpl 会把含巨大 software JSON 的整行打到 stdout，
    # 既拖慢调度又使日志暴涨）；需要排查 SQL 时临时改为 org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

plugin:
  # 内网穿透：两种实现共用「一份配置文件一条映射」的本地持久化目录，不写数据库。
  # 启动方式有两种，互不冲突：
  #   1. properties 启动：auto-start=true 时应用就绪后自动拉起映射；
  #   2. 页面实时启停：监控页「内网穿透」发起 /ms/tunnel/** 调用（默认走这种）。
  # 这里保持 auto-start=false：监控进程自身不主动暴露公网端口，由页面按需启动。
  ngrok:
    enable: true
    auto-start: false
    # 每条映射一个 JSON 文件；不配时默认 ~/.chua/tunnel/ngrok
    # store-dir: ${user.home}/.chua/tunnel/ngrok
  cloudflared:
    enable: true
    auto-start: false
    # 每条映射一个 JSON 文件；不配时默认 ~/.chua/tunnel/cloudflared
    # store-dir: ${user.home}/.chua/tunnel/cloudflared
  api:
    request-decode:
      enable: false
  # 上报客户端（report-client）注册服务端：
  # 应用侧引入 spring-support-report-client-starter 后，经 SyncClient 连接本服务端并发送
  #   - sync/client/register  （客户端注册：ip/port/应用名）
  #   - monitor/app/report    （定时应用信息：serviceUrl/JVM/OS/启动时间等）
  # 「节点管理 → 在线节点」与 /ms/monitor/node/discovery 依据这些注册信息展示在线节点。
  # 端口通过 MONITOR_SYNC_PORT 覆盖（默认 19380，与 report-client 默认服务端端口一致）。
  # 协议用 tcp：report 客户端的 HttpSyncClient.send 把 topic 当成表单键（服务端按 topic= 解析），
  # http 模式下注册消息会被服务端拒绝；tcp 是两端已对齐且经真实验收的链路。
  sync:
    type: server
    # 本服务只接收注册/心跳，不使用数据同步交换能力
    data-sync:
      enabled: false
    server:
      enable: true
      host: 0.0.0.0
      port: ${MONITOR_SYNC_PORT:19380}
      protocol: tcp
  # 本地联调免鉴权：monitor 全部 /ms/** 接口加入 OAuth 白名单（无远程鉴权服务时直接放行）
  oauth:
    enable: false
    whitelist:
      - /ms/**
      # 登录页挂载/登录态落地前拉取默认配置，不带有效令牌；不放行会 403 被前端误判登录失效
      # （同 eduai 先例 spring-support-eduai-starter application.yml）。详见 AuthFilter 白名单机制。
      - /v2/setting/default
      # 登录页挂载/登录态落地前拉取三方登录来源，不带有效令牌；不放行会 403 被前端误判登录失效。
      # 本端点由 common-service 的 SysSettingController 提供并标注 @TokenForIgnore，monitor 未
      # 引入 common-service（无对应 Controller），放行后走不到控制器，统一退回 404 "资源不存在"，
      # 前端 loadProviders 已 catch 404/403，不会触发 403 会话失效链。
      - /v2/setting/sso/providers
    # 文件服务器私有桶（逗号分隔，* 表示全部）：由服务管理节点自动挂载的 OAuthServerFilter 执行鉴权；
    # enable=false 或留空时文件服务器按公共桶运行；/ot 一次性链接本身即凭证，始终放行
    file-storage:
      private-buckets: localFileStorage
  # 服务器目录浏览（filesystem-starter 的 FileDirController）：数据同步的「选择文件 / 文件夹」
  # 和 AI 的目录选择器都走 /v2/file/dir/list。接口本身是 @Permission(admin/superadmin)，
  # 生产由 OAuth 把关。控制器由本应用的 MonitorFileStorageGatewayConfig#fileDirController
  # 注册（FileSystemAutoConfiguration 已被上面 exclude，原注册点不存在）；本开关只控制
  # 是否真正对外开放：关闭时接口返回业务错误而不是 404。
  filesystem:
    dir-list: true
    # 默认存储桶：/v2/file/server-config 会把这里的值作为 bucket 下发给前端，
    # 前端拿它拼 /fs/{bucket}。必须与 MonitorFileStorageGatewayConfig.BUCKET
    # （= localFileStorage，即网关实际注册的桶名）一致。
    # 不配时该字段为 null，前端回退到自己的默认值 local —— 落到一个不存在的桶，
    # 文件管理页直接 404/空列表，且报错信息与「服务没起来」无法区分。
    default-provider: localFileStorage
  # 异步线程池（common-starter AsyncThreadPoolConfiguration 实现 AsyncConfigurer）：
  # 与 Spring Boot 4.1 自动装配的 TaskExecutionAutoConfiguration 存在 AsyncConfigurer 二选一冲突
  # （queue-starter ApplicationEventToQueueListener @Async 触发时 "Only one AsyncConfigurer may exist"）。
  # 关闭自建配置，由 Spring Boot 默认 executor 接管 @Async。
  async:
    enable: false
  # 声明式缓存（对应 @Cacheable / @CacheEvict：monitorTask、monitorConfig、monitor、
  # monitorGateway、monitorMetricConfig、monitor:alarm:*、monitor:metric:latest）。
  # 必须开启多级缓存管理器（CacheConfiguration#multiLevelCacheManager，带 @Primary）：
  #   - 它的 getCache(name) 走 computeIfAbsent + buildCache，**按需创建任意缓存名**；
  #   - 关掉时 CacheManagerResolver 只能选中 ai-starter 的 aiCacheManager
  #     （CaffeineCacheManager 默认 setDynamic=false），@Cacheable 的缓存名未静态注册，
  #     每次调用抛 IllegalArgumentException: Cannot find cache named 'monitorTask'，
  #     实测 MonitorScheduler 的 tick 每 20 秒失败一次（定时任务全部不执行）。
  # levels 只留 caffeine：monitor 的缓存都是本机调度/配置的短命读缓存，多实例间无需共享；
  # 且 Redis 档一旦连接抖动，@Cacheable 会跟着失败（缓存不该拖垮主流程）。
  cache:
    enabled: true
    levels:
      - caffeine
    caffeine:
      initial-capacity: 256
      maximum-size: 20000
      # 配置/任务列表类缓存，写操作都会 @CacheEvict(allEntries=true)，5 分钟兜底足够
      expire-after-write: 300
      record-stats: true
  # FlywayLike 脚本迁移（DataSourceScriptConfiguration）：建表与种子数据统一走这里。
  # 之前 enable: false（理由是「H2 下 MySQL-only 语法会阻断启动」），改用 spring.sql.init
  # 逐个列举 schema-locations —— 代价是漏列就静默不执行、依赖 jar 里的脚本路径难写。
  # 现在统一走 SPI Flyway（DataSourceFlyway）：语句级容错（continueOnError）+ 「目标表不存在
  # 则跳过」，H2 下的方言差异语句会被跳过并记账，不会阻断启动。
  datasource:
    script:
      enable: true
      # ALWAYS：表结构脚本每次启动都扫，是否真执行由 sys_database_version 的
      # 「脚本名+版本」执行记录决定（已成功过的不会重跑）；补列语句靠版本号递进
      # 让记录失效，从而在存量库上补齐缺失的列。
      scan-mode: ALWAYS
      # 种子数据仍保持 ONCE：种子脚本体积大，且业务表非空即无需重灌。
      data-scan-mode: ONCE
      continue-on-error: true
      verbose: true
  # 实时推送通道：socketio(29181)
  # tshark 抓包逐包/会话状态广播（前端 subscribe("monitor","tshark-packet"/"tshark-session")）
  socket:
    enable: true
    protocol: socketio
    host: 0.0.0.0
    room:
      - client-id: default
        context-path: /socket.io
        port: 29181
  # 队列模块
  queue:
    enable: true
    type: local
  # 时序存储引擎：datasource / redis / influxdb / questdb / none（默认 datasource）
  # datasource：JDBC 数据库明细表（用 Engine + SqlExecutor）
  # redis：Redis ZSET 简化时序（默认取 spring.data.redis；plugin.monitor.timeseries.url 配成 redis:// 地址时覆盖）
  # influxdb：需 InfluxDB 服务（plugin.monitor.timeseries.url 指向其 HTTP 端点）
  # questdb：需 QuestDB 服务（plugin.monitor.timeseries.url 指向其 HTTP 9000 端点）
  # none：跳过时序，仅 MySQL 明细
  monitor:
    timeseries:
      # 主机历史与监控项双写统一走 SeriesEngine；datasource=JDBC 实现，可切 redis/influxdb
      engine: datasource
      url: http://172.16.0.40:8086
      database: monitor
    history:
      # 主机指标历史保留天数
      retention-days: 7
    ssh:
      # OpenSSH 采集通道超时；慢链路/高 RTT 可调大
      connect-timeout-seconds: 15
      session-timeout-seconds: 15
      exec-timeout-seconds: 60
    tshark:
      # 抓包工具自动补齐：启动时用虚拟线程探测一次，缺失则解压便携包（不需要管理员权限）。
      # 已有 Wireshark 的机器会被自动识别（Program Files / PATH），无需配置。
      # 只补 tshark 本体；实时抓包仍需要抓包驱动（Windows: Npcap / Linux: libpcap），
      # 页面会如实提示「可解析但不可实时抓包」，不会静默安装内核驱动。
      auto-install: true
      # 离线部署：把含 tshark 与依赖 DLL 的 zip 放到机器上，填绝对路径（优先于 package-url）
      # package-path: /data/packages/tshark-win64.zip
      # 内网镜像地址（zip）。两者都为空时只探测、不下载，状态会提示「缺少安装包」
      # package-url: http://10.0.0.5:8094/ms/tshark/package
      # 解压目录，留空用 ~/spring-support/tshark
      # install-dir: /data/app/tshark
      # 下载 + 解压 + 自检的总超时（秒）
      timeout-seconds: 600
      # 是否再跑一次 tshark -T json -x：把每包完整协议层 JSON（rawData）与
      # 协议还原出的明文（restoredText，HTTP / TLS / DNS / SSH / FTP / SMTP / MQTT / 数据库协议...）
      # 回写到报文表，让离线导入与实时抓包的「协议还原」显示完整。生产默认开启，
      # 嫌解析慢或不需要时可以设为 false
      json-restore: true

logging:
  level:
    # 生产默认 info；需要排查采集/推送细节时临时改 debug
    com.chua.starter.monitor.support: info
