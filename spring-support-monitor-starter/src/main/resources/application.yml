server:
  port: 8081

spring:
  application:
    name: monitor-test
  autoconfigure:
    exclude:
      - com.chua.metrics.support.MetricsAutoConfiguration
      # filesystem-starter 自带的 web 分片上传链(auto-config 引用 monitor 未装配的 Service/Controller Bean), 排除之;
      # 我们只需其 FileStorageServerFilter/Setting/LocalFileStorage 类(file-storage 插件反射加载)
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
  ai:
    generate:
      enabled: false

  # 建表脚本迁移：默认由 spring-support-datasource-starter 的 EnvironmentPostProcessor
  # 强制 spring.sql.init.mode=never + plugin.datasource.script.enable=true（全局默认），
  # 启动时自动扫描 classpath*:db/init|migration|sync 下 V*__*.sql 执行（FlywayLike）。
  # 覆盖 monitor 自身 + 依赖 server-starter/project-starter 的资产台账/项目表。
  # filesystem-starter 自带 db/init 含 MySQL-only 语法（SET @x=IF(...)），H2 下会失败；
  # continue-on-error=true（见下方 plugin.datasource.script）保证单脚本失败不阻断启动。

  datasource:
    url: jdbc:h2:mem:monitordb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # Redis（告警静默期 + 可选时序引擎 monitor.timeseries.engine=redis）
  data:
    redis:
      host: 172.16.0.40
      port: 6379
      # password: xxx
      timeout: 5s

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.chua.starter.monitor.support.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

plugin:
  api:
    request-decode:
      enable: false
  # 异步线程池（common-starter AsyncThreadPoolConfiguration 实现 AsyncConfigurer）：
  # 与 Spring Boot 4.1 自动装配的 TaskExecutionAutoConfiguration 存在 AsyncConfigurer 二选一冲突
  # （queue-starter ApplicationEventToQueueListener @Async 触发时 "Only one AsyncConfigurer may exist"）。
  # 关闭自建配置，由 Spring Boot 默认 executor 接管 @Async。
  async:
    enable: false
  # FlywayLike 脚本迁移（DataSourceScriptConfiguration）：启用。
  # DataSource 就绪后自动扫描 classpath*:db/init|migration|sync 下 V*__*.sql，
  # monitor 独立启动即建全部表（monitor/server/project 模块的资产台账与监控表均在 SQL 文件）。
  datasource:
    script:
      enable: true
      scan-mode: ONCE
      migration-scan-mode: ALWAYS
      continue-on-error: true
      ignore-failed-drops: true
      verbose: true
# 实时推送通道：socketio(29181)
  # tshark 抓包逐包/会话状态广播（前端 subscribe("monitor","tshark-packet"/"tshark-session")）
  socket:
    enable: true
    protocol: socketio
    host: 0.0.0.0
    room:
      - client-id: default
        context-path: /socket.io
        port: 29181
  # 队列模块
  queue:
    enable: true
    type: local

# 时序存储引擎：influxdb / redis / none（默认 influxdb，向后兼容）
# influxdb：需 InfluxDB 服务；redis：走 ZSET 简化时序（需上方 spring.data.redis 可达）
monitor:
  timeseries:
    engine: influxdb
    url: http://172.16.0.40:8086
    database: monitor

logging:
  level:
    com.chua.starter.monitor.support: debug
