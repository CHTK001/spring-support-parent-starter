server:
  port: 8082

spring:
  application:
    name: monitor-test
  autoconfigure:
    exclude:
      # filesystem-starter 自带的 web 分片上传链(auto-config 引用 monitor 未装配的 Service/Controller Bean), 排除之;
      # 我们只需其 FileStorageServerFilter/Setting/LocalFileStorage 类(file-storage 插件反射加载)
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
      # redis-starter 的 RedisConfiguration 在 Spring Boot 4 下出现 RedisProperties 重复注册冲突，本地联调排除
      - com.chua.starter.redis.support.RedisConfiguration
      # crypto-starter 密钥块完整性校验需口令，本地联调无密钥环境排除
      - com.chua.crypto.support.spring.CryptoAutoConfiguration
      # job-starter 依赖 JobMapper（mybatis 表映射），monitor 本地联调无该表排除
      - com.chua.starter.job.support.JobAutoConfiguration
  ai:
    generate:
      enabled: false

  # 上传上限：PCAP 分析要整份导入抓包文件，Spring 默认上限 1MB —— 连一个几百包的 pcap 都装不下，
  # 会在进入 Controller 之前就抛 MaxUploadSizeExceededException（前端只看到 500，看不出原因）。
  # 这里放开到 2GB；前端导入前也会做一次大小校验，两处阈值要保持一致。
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 2048MB

  # 建表脚本（独立联调）：本模块的 FlywayLike 已禁用（脚本语法错会阻断启动），
  #  由 spring.sql.init 逐个加载各模块本体的全量建表脚本（脚本归口各自 starter jar 的 db/init/）：
  #  - monitor 自身：V1.0__init_all_monitor.sql、V1.5__init_tshark.sql
  #  - 依赖 jar 内：V1.0__init_all_server.sql（资产台账）、V1.0__init_all_project.sql、V1.0__init_all_ai.sql
  # 均为 MySQL/H2 双库可执行子集（IF NOT EXISTS 幂等），存量老库补列脚本（db/upgrade/）不在此加载
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: true
      schema-locations:
        - classpath:db/init/V1.0__init_all_monitor.sql
        - classpath:db/init/V1.0__init_all_server.sql
        - classpath:db/init/V1.0__init_all_ai.sql
        # 存量库补列（ai-starter 的版本化脚本，MySQL 专用）：
        # V1.0__init_all_ai.sql 里 sys_ai_bot_binding 的「三列」只覆盖全新库，
        # 存量库因 CREATE TABLE IF NOT EXISTS 空操作而缺列，AiBotChatService.init
        # 按实体全列 SELECT 会在启动期抛 Unknown column 并中断 refresh（2026-10-16 实测）。
        # 本机 plugin.datasource.script.enable=false（FlywayLike 关闭），版本化脚本
        # 不会自动执行，故必须显式登记。脚本内部用 information_schema 判存 + 动态 DDL，
        # 可反复执行（MySQL 8.4 不支持 ADD COLUMN IF NOT EXISTS，详脚本头注释）。
        - classpath:db/init/V4.0.0.57__add_whatsapp_bot_binding_columns.sql
        # 数据源中心台账（spring-support-datasource-hub-starter 自有脚本）
        - classpath:db/init/V1.0__init_all_datasource_hub.sql
        # 设备台账（spring-support-device-starter 自有脚本）：device_* 七张表。
        # device-starter 为纯库，其 db/init 不在 monitor 的 resources 下，靠 jar 依赖进入 classpath。
        # 表名无 ms_ 前缀且与 ms_monitor_/ms_server_/sys_ai_/ms_datasource_ 无重名冲突。
        - classpath:db/init/V1.0__init_all_device.sql
      # 种子数据必须显式列出 data-locations，否则 initdata 从不执行：
      # 早先只配了 schema-locations，导致 ms_monitor_config / ms_monitor_alarm_policy /
      # ms_monitor_alarm_rule 三张表全为空（保留期配置与 4 条项目守护告警规则从未落地）。
      # 这几份 initdata 都是幂等的（monitor 每条 INSERT 带 WHERE/AND NOT EXISTS，
      # server 用 INSERT IGNORE / ON DUPLICATE KEY），因此 mode=always 下反复执行不会产生重复行。
      #
      # ⚠ 只能列「有实际语句」的文件：ai 与 datasource_hub 的 initdata 是纯注释占位，
      # 而 Spring 的 ScriptUtils.splitSqlScript 对空脚本会直接抛
      # `IllegalArgumentException: 'script' must not be null or empty`，
      # 且该异常发生在脚本级、continue-on-error 拦不住 → 整个应用启动失败。
      data-locations:
        - classpath:db/init/V1.0__initdata_all_monitor.sql
        - classpath:db/init/V1.0__initdata_all_server.sql
        # 注：bot_binding 补列 / tshark / exec_job type / host ssh_enabled 等脚本
        # 在本次重构中被合并/删除（本地脚本易被还原），故不再单列，避免启动缺文件拦截

  datasource:
    url: jdbc:mysql://172.16.0.40:3306/report?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MONITOR_DB_PASSWORD:}

  # Redis（告警静默期 + 可选时序引擎 monitor.timeseries.engine=redis）
  data:
    redis:
      host: 172.16.0.40
      port: 6379
      # password: xxx
      timeout: 3s

  # guacd 远控隧道：本地 8082 连接 8080 服务器上的 guacd（124.221.230.112:4822 已开放）
  support:
    guacd:
      host: 124.221.230.112
      port: 4822
      # 浏览器回连本机的 WS 隧道端点（guacamole 客户端 -> 8082 /ws/ms/server/terminal）
      client-host: 127.0.0.1:8848

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.chua.starter.monitor.support.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境关闭 SQL/结果全量打印（StdOutImpl 会把含巨大 software JSON 的整行打到 stdout，
    # 既拖慢调度又使日志暴涨）；需要排查 SQL 时临时改为 org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

plugin:
  api:
    request-decode:
      enable: false
  # 本地联调免鉴权：monitor 全部 /ms/** 接口加入 OAuth 白名单（无远程鉴权服务时直接放行）
  oauth:
    enable: false
    whitelist:
      - /ms/**
    # 文件服务器私有桶（逗号分隔，* 表示全部）：由服务管理节点自动挂载的 OAuthServerFilter 执行鉴权；
    # enable=false 或留空时文件服务器按公共桶运行；/ot 一次性链接本身即凭证，始终放行
    file-storage:
      private-buckets: localFileStorage
  # 服务器目录浏览（filesystem-starter 的 FileDirController）：数据同步的「选择文件 / 文件夹」
  # 和 AI 的目录选择器都走 /v2/file/dir/list。接口本身是 @Permission(admin/superadmin)，
  # 生产由 OAuth 把关；这里只负责把控制器注册出来（FileSystemAutoConfiguration 已被排除）。
  filesystem:
    dir-list: true
  # 异步线程池（common-starter AsyncThreadPoolConfiguration 实现 AsyncConfigurer）：
  # 与 Spring Boot 4.1 自动装配的 TaskExecutionAutoConfiguration 存在 AsyncConfigurer 二选一冲突
  # （queue-starter ApplicationEventToQueueListener @Async 触发时 "Only one AsyncConfigurer may exist"）。
  # 关闭自建配置，由 Spring Boot 默认 executor 接管 @Async。
  async:
    enable: false
  # FlywayLike 脚本迁移（DataSourceScriptConfiguration）：monitor 独立联调时禁用。
  # classpath 上 filesystem/project 模块的 db/init 脚本含 MySQL-only 语法（SET @x=IF(...)），
  # H2 下语法错误即使 continue-on-error 也可能阻断启动；必要 DDL 由 spring.sql.init.schema-locations
  # 单独加载（纯 H2 兼容），生产 MySQL 环境可改回 enable: true。
  datasource:
    script:
      enable: false
  # 实时推送通道：socketio(29181)
  # tshark 抓包逐包/会话状态广播（前端 subscribe("monitor","tshark-packet"/"tshark-session")）
  socket:
    enable: true
    protocol: socketio
    host: 0.0.0.0
    room:
      - client-id: default
        context-path: /socket.io
        port: 29181
  # 队列模块
  queue:
    enable: true
    type: local

# 时序存储引擎：datasource / redis / influxdb / questdb / none（默认 datasource）
# datasource：JDBC 数据库明细表（用 Engine + SqlExecutor）
# redis：Redis ZSET 简化时序（默认取 spring.data.redis；monitor.timeseries.url 配成 redis:// 地址时覆盖）
# influxdb：需 InfluxDB 服务（monitor.timeseries.url 指向其 HTTP 端点）
# questdb：需 QuestDB 服务（monitor.timeseries.url 指向其 HTTP 9000 端点）
# none：跳过时序，仅 MySQL 明细
monitor:
  timeseries:
    # 主机历史与监控项双写统一走 SeriesEngine；datasource=JDBC 实现，可切 redis/influxdb
    engine: datasource
    url: http://172.16.0.40:8086
    database: monitor
  history:
    # 主机指标历史保留天数
    retention-days: 7
  ssh:
    # OpenSSH 采集通道超时；慢链路/高 RTT 可调大
    connect-timeout-seconds: 15
    session-timeout-seconds: 15
    exec-timeout-seconds: 60

logging:
  level:
    # 生产默认 info；需要排查采集/推送细节时临时改 debug
    com.chua.starter.monitor.support: info
