server:
  port: 8082

spring:
  application:
    name: monitor-test
  autoconfigure:
    exclude:
      - com.chua.metrics.support.MetricsAutoConfiguration
      # filesystem-starter 自带的 web 分片上传链(auto-config 引用 monitor 未装配的 Service/Controller Bean), 排除之;
      # 我们只需其 FileStorageServerFilter/Setting/LocalFileStorage 类(file-storage 插件反射加载)
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
      # redis-starter 的 RedisConfiguration 在 Spring Boot 4 下出现 RedisProperties 重复注册冲突，本地联调排除
      - com.chua.starter.redis.support.RedisConfiguration
      # crypto-starter 密钥块完整性校验需口令，本地联调无密钥环境排除
      - com.chua.crypto.support.spring.CryptoAutoConfiguration
      # job-starter 依赖 JobMapper（mybatis 表映射），monitor 本地联调无该表排除
      - com.chua.starter.job.support.JobAutoConfiguration
  ai:
    generate:
      enabled: false

  # 建表脚本（独立联调）：本模块的 FlywayLike 已禁用（H2 下脚本语法错会阻断启动），
  #  由 spring.sql.init 逐个加载各模块本体的全量建表脚本（脚本归口各自 starter jar 的 db/init/）：
  #  - monitor 自身：V1.0__init_all_monitor.sql、V1.5__init_tshark.sql
  #  - 依赖 jar 内：V1.0__init_all_server.sql（资产台账）、V1.0__init_all_project.sql、V1.0__init_all_ai.sql
  # 均为 MySQL/H2 双库可执行子集（IF NOT EXISTS 幂等），存量老库补列脚本（db/upgrade/）不在此加载
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: true
      schema-locations:
        - classpath:db/init/V1.0__init_all_monitor.sql
        - classpath:db/init/V1.0__init_all_server.sql
        - classpath:db/init/V1.0__init_all_ai.sql
        # TShark 抓包两张表（本模块自有，全量脚本未包含）
        - classpath:db/init/V1.5__init_tshark.sql

  datasource:
    url: jdbc:h2:file:./data/monitordb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # Redis（告警静默期 + 可选时序引擎 monitor.timeseries.engine=redis）
  data:
    redis:
      host: 172.16.0.40
      port: 6379
      # password: xxx
      timeout: 3s

  # guacd 远控隧道：本地 8082 连接 8080 服务器上的 guacd（124.221.230.112:4822 已开放）
  support:
    guacd:
      host: 124.221.230.112
      port: 4822
      # 浏览器回连本机的 WS 隧道端点（guacamole 客户端 -> 8082 /ws/ms/server/terminal）
      client-host: 127.0.0.1:8848

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.chua.starter.monitor.support.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

plugin:
  api:
    request-decode:
      enable: false
  # 本地联调免鉴权：monitor 全部 /ms/** 接口加入 OAuth 白名单（无远程鉴权服务时直接放行）
  oauth:
    enable: false
    whitelist:
      - /ms/**
  # 异步线程池（common-starter AsyncThreadPoolConfiguration 实现 AsyncConfigurer）：
  # 与 Spring Boot 4.1 自动装配的 TaskExecutionAutoConfiguration 存在 AsyncConfigurer 二选一冲突
  # （queue-starter ApplicationEventToQueueListener @Async 触发时 "Only one AsyncConfigurer may exist"）。
  # 关闭自建配置，由 Spring Boot 默认 executor 接管 @Async。
  async:
    enable: false
  # FlywayLike 脚本迁移（DataSourceScriptConfiguration）：monitor 独立联调时禁用。
  # classpath 上 filesystem/project 模块的 db/init 脚本含 MySQL-only 语法（SET @x=IF(...)），
  # H2 下语法错误即使 continue-on-error 也可能阻断启动；必要 DDL 由 spring.sql.init.schema-locations
  # 单独加载（纯 H2 兼容），生产 MySQL 环境可改回 enable: true。
  datasource:
    script:
      enable: false
  # 实时推送通道：socketio(29181)
  # tshark 抓包逐包/会话状态广播（前端 subscribe("monitor","tshark-packet"/"tshark-session")）
  socket:
    enable: true
    protocol: socketio
    host: 0.0.0.0
    room:
      - client-id: default
        context-path: /socket.io
        port: 29181
  # 队列模块
  queue:
    enable: true
    type: local

# 时序存储引擎：datasource / redis / influxdb / none（默认 datasource）
# datasource：JDBC 数据库明细表（用 Engine + SqlExecutor）
# redis：Redis ZSET 简化时序（需上方 spring.data.redis 可达）
# influxdb：需 InfluxDB 服务
# none：跳过时序，仅 MySQL 明细
monitor:
  timeseries:
    engine: none
    url: http://172.16.0.40:8086
    database: monitor

logging:
  level:
    com.chua.starter.monitor.support: debug
