server:
  port: 8081

spring:
  application:
    name: monitor-test
  autoconfigure:
    exclude:
      - com.chua.metrics.support.MetricsAutoConfiguration
      # filesystem-starter 自带的 web 分片上传链(auto-config 引用 monitor 未装配的 Service/Controller Bean), 排除之;
      # 我们只需其 FileStorageServerFilter/Setting/LocalFileStorage 类(file-storage 插件反射加载)
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
  ai:
    generate:
      enabled: false

  # 独立联调模式: 启动时执行建表脚本(幂等, IF NOT EXISTS)
  # 含 server-starter 的资产台账 DDL(V1.0__init_server.sql),
  # 使 monitor 独立 H2 下也具备 ms_server_host 等表, 供资产联动查询
  # V1.3 补充 ms_monitor.ms_server_host_id 列, 打通资产→监控项联动
  # 注意: spring.sql.init 仅加载本模块 classpath 下的脚本; filesystem-starter
  # 自带的 data-locations(*.sql) 通过其 auto-config 生效, 已被 exclude 排除
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init/V1.0__init_monitor.sql,classpath:db/init/V1.1__alarm_and_agent.sql,classpath:db/init/V1.0__init_server.sql,classpath:db/init/V1.1__add_host_delay_detect.sql,classpath:db/init/V1.3__monitor_host_link.sql,classpath:db/init/V1.0__init_project.sql,classpath:db/init/V1.1__project_extend.sql

  datasource:
    url: jdbc:h2:mem:monitordb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # Redis（告警静默期 + 可选时序引擎 monitor.timeseries.engine=redis）
  data:
    redis:
      host: 172.16.0.40
      port: 6379
      # password: xxx
      timeout: 5s

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.chua.starter.monitor.support.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

plugin:
  api:
    request-decode:
      enable: false
  # FlywayLike 脚本迁移（DataSourceScriptConfiguration）：禁用。
  # 文件系统 jar 中的 db/init 脚本含 MySQL-only 语法（SET @x=IF(...)），H2 下会阻断启动。
  # 必要 DDL 由 spring.sql.init.schema-locations 独立加载（纯 H2 兼容语句）
  datasource:
    script:
      enable: false
  # 实时推送通道：tshark 抓包逐包/会话状态广播（前端 subscribe("monitor", "tshark-packet"/"tshark-session")）
  # 关闭 enable 后 MonitorPushService 推送静默跳过，不影响抓包本身
  socket:
    enable: true
    protocol: socketio
    host: 0.0.0.0
    room:
      - client-id: default
        context-path: /socket.io
        port: 29181
  # 消息队列：socket 推送经 queue 解耦（MonitorPushService → queue: socket:push → SocketQueueBridge → 前端）
  # 单机用 local（Guava EventBus），多实例用 kafka/rabbitmq/mqtt 实现分布式广播
  queue:
    enable: true
    type: local

# 时序存储引擎：influxdb / redis / none（默认 influxdb，向后兼容）
# influxdb：需 InfluxDB 服务；redis：走 ZSET 简化时序（需上方 spring.data.redis 可达）
monitor:
  timeseries:
    engine: influxdb
    url: http://172.16.0.40:8086
    database: monitor

logging:
  level:
    com.chua.starter.monitor.support: debug
