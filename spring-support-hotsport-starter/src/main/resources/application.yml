# ============================================================
# Hotsport (APM 热点观测) 启动配置
# ============================================================
server:
  port: 8086

spring:
  application:
    name: hotsport
  # 嵌入式 H2 兜底 DataSource（common-starter 的 ApiConfiguration 异常处理器
  # 依赖 spring-jdbc，但 hotsport 业务本身不写库；纯内存、无文件、无网络）
  datasource:
    url: jdbc:h2:mem:hotsportdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # 关闭 SQL 初始化（无建表脚本）
  sql:
    init:
      mode: never
  # 单 jar 交付：前端构建产物置于 classpath:/static/，默认托管
  web:
    resources:
      static-locations: classpath:/static/

# APM 数据源与 Agent 自注入开关
hotsport:
  # 静态存储后端：inmemory / sqlite / noop
  apm:
    storage:
      type: inmemory
      retention-ms: 604800000

# Agent 自注入（spring-support-agent-starter 自动配置，前缀 runtime.agent）
runtime:
  agent:
    enabled: true
    shell-port: 4567
    options: ""
    async: true

logging:
  level:
    com.chua.starter.hotsport: INFO
