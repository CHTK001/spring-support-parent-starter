# ============================================================
# Hotsport (APM 热点观测) 启动配置
#
# 本后台是纯观测进程：不依赖任何外部数据库（已排除 DataSourceAutoConfiguration），
# APM 数据全部来自 StorageManager SPI（inmemory / sqlite）+ 真实字节码采集。
# ============================================================
server:
  port: 8086

spring:
  application:
    name: hotsport
  # 单 jar 交付：前端构建产物置于 classpath:/static/，默认托管
  web:
    resources:
      static-locations: classpath:/static/

# APM 数据源与 Agent 自注入开关
plugin:
  hotsport:
    # 演示数据种子已彻底移除：页面只显示真实采集数据，无数据即空态。
    # （历史 demo.seed 会伪造 120 条传输/6 条依赖/5 条泄漏/40 条日志，已删除）
    # 静态存储后端：inmemory / sqlite / noop
    apm:
      storage:
        type: inmemory
        retention-ms: 604800000
  # Agent 自注入（spring-support-agent-starter 自动配置，前缀 plugin.agent）
  agent:
    enabled: true
    shell-port: 4567
    options: ""
    async: true

logging:
  level:
    com.chua.starter.hotsport: INFO
