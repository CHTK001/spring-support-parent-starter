# ============================================================
# Hotsport (APM 热点观测) 启动配置
# ============================================================
server:
  port: 8086

spring:
  application:
    name: hotsport
  # DataSource（common-starter 的 ApiConfiguration 异常处理器依赖 spring-jdbc，
  # 但 hotsport 业务本身不写库）；已移除 H2，改用 MySQL，启动需可连的 MySQL
  datasource:
    url: jdbc:mysql://172.16.0.40:3306/hotsport?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${HOTSPORT_DB_PASSWORD:}
  # 关闭 SQL 初始化（无建表脚本）
  sql:
    init:
      mode: never
  # 单 jar 交付：前端构建产物置于 classpath:/static/，默认托管
  web:
    resources:
      static-locations: classpath:/static/

# APM 数据源与 Agent 自注入开关
plugin:
  hotsport:
    # 演示数据种子：自 attach 对已加载类无法补织，开启 DemoSeedRunner 注入
    # 真实格式数据保证页面有数（生产环境可关）
    demo:
      seed: true
    # 静态存储后端：inmemory / sqlite / noop
    apm:
      storage:
        type: inmemory
        retention-ms: 604800000
  # Agent 自注入（spring-support-agent-starter 自动配置，前缀 plugin.agent）
  agent:
    enabled: true
    shell-port: 4567
    options: ""
    async: true

logging:
  level:
    com.chua.starter.hotsport: INFO
