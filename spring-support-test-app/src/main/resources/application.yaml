# 排除 AuthClientConfiguration：其 AuthFilter 依赖真实 OAuth 服务（无服务时 403 拦截所有请求）；
# AOP 权限拦截链（PermissionInterceptor）由 PermissionInterceptorConfiguration 以真实类注册，
# 与生产装配一致，本测试应用以"本地联调（无用户上下文注入 admin）"模式运行
# 排除 DataSourceScriptConfiguration：脚本运行器（BeanPostProcessor）的版本记录表 DDL 含 MySQL
# 专属 COMMENT 子句（H2 报 bad SQL grammar），启动期经分片代理的版本查询抛 TableNotFound 毒化
# ShardingSphere 模式元数据 -> 分片路由查询不可用；脚本功能非本批测试目标（与生产装配差异已记录）
spring:
  autoconfigure:
    exclude:
      - com.chua.starter.oauth.client.support.configuration.AuthClientConfiguration
      - com.chua.starter.datasource.configuration.DataSourceScriptConfiguration
  application:
    name: spring-support-test-app
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    # 数据源分片（ShardingSphere v5 集成）：orders 表按 id MOD 分片到两个 H2 分片库
    sharding:
      enabled: true
      databases:
        - jdbc:h2:mem:shard0;DB_CLOSE_DELAY=-1;MODE=MYSQL;IGNORECASE=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
        - jdbc:h2:mem:shard1;DB_CLOSE_DELAY=-1;MODE=MYSQL;IGNORECASE=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
      tables:
        - logic-table: orders
          sharding-column: id

# 数据权限（@DataScope）启用：字段列名使用框架默认值（sys_dept_id / create_by）；
# oauth-client：本地联调模式（无远程 OAuth 服务时 ThreadLocal 注入 admin 上下文）；
# whitelist 放行测试端点；block-address 指向永不匹配路径以关闭 AuthFilter 的 token 认证
# （权限校验仍由 AOP PermissionInterceptor 把关，与生产拦截链一致）
plugin:
  # api 版本/灰度：开启灰度全局开关（ApiControlInterceptor 灰度校验生效）；
  # uniform/encode/decode 为响应增强（默认开启），测试聚焦版本路由与灰度，显式关闭保持原始响应
  api:
    gray:
      enable: true
    uniform: false
    encode:
      enable: false
    decode:
      enable: false
  mybatis:
    data:
      scope:
        enable: true
  oauth:
    enable: true
    block-address:
      - /__authfilter_off__/**
    whitelist:
      - /api/permission/**
      - /api/datascope/**
      - /api/api-version/**
      - /api/ds/**

# 多数据源（@DS 动态切换 + 数据源合并）：两个独立 H2 内存库，各含可区分的 region 数据
  multi-datasource:
    enable: true
    data-source:
      - name: ds1
        url: jdbc:h2:mem:ds1;DB_CLOSE_DELAY=-1
        username: sa
        password: ""
      - name: ds2
        url: jdbc:h2:mem:ds2;DB_CLOSE_DELAY=-1
        username: sa
        password: ""
