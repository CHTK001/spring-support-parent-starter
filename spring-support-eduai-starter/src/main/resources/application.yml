# 教育 AI 工作台 后端配置（本地开发）
server:
  port: 19095

spring:
  application:
    name: spring-support-eduai-starter
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  # MySQL / MariaDB：已彻底移除 H2（无 H2 驱动、无 jdbc:h2、H2 自动配置不生效）
  # 下方为本地开发默认值；部署环境由 systemd ExecStart 的 --spring.datasource.* 覆盖
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/eduai?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ""
  sql:
    init:
      mode: never
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  autoconfigure:
    exclude:
      # Redisson 3.36 的 V2 自动配置 @EnableConfigurationProperties 引用了
      # Boot 4 已删除的 org.springframework.boot.autoconfigure.data.redis.RedisProperties；
      # 仅 V2 注册在 AutoConfiguration.imports 中（父类不是自动配置类，不可 exclude）。
      # 本项目由 spring-support-redis-starter.RedisConfiguration 自建 RedissonClient。
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

# 采集任务配置
eduai:
  collect:
    default-cron: "0 0/30 * * * ?"

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.chua.starter.eduai.model

# 数据源脚本（db/init 下 V*__*.sql 建表 + initdata）
plugin:
  # 跨域来源白名单。
  #
  # 框架 ApiCorsConfiguration 是**白名单制**：allowed-origins 为空时
  # 「不放行任何跨域来源」（同源不受影响）。这是 2026-10-01 的安全加固
  # （撤销原先的 allowedOriginPatterns("*") + allowCredentials(true)）。
  #
  # 为什么 eduai 必须配（2026-10-04 实测）：浏览器发 POST 必带 Origin，而
  # vite dev 代理的 changeOrigin **只改 Host、不改 Origin**，会把它原样转给后端；
  # 后端据此判定为跨域，白名单为空 -> 403 "Invalid CORS request"，表现为「登录 403」。
  # 登录页正是 POST /v2/user/login，于是整站登录被 403 打断。
  # 而 curl 不带 Origin，所以之前的验收套件从未覆盖到这条路径 —— 该回归
  # 是 2026-10-01 加固时漏配本项造成的。
  #
  # 不放 "*"：框架文档明确「通配来源 + 允许携带凭证」等于任意站点可带用户
  # 凭证读接口响应。这里只列开发来源，端口用通配（Spring 原生支持 http://host:*）。
  api:
    cors:
      enable: true
      allowed-origins:
        # 本机前端（vite dev，端口不固定，故用通配）
        - "http://localhost:*"
        - "http://127.0.0.1:*"
        # 局域网内前端（含直接以 198 的前端端口打开的场景）
        - "http://192.168.50.*:*"
  async:
    enable: false
  # 鉴权协议（2026-10-18 修正为 static）：
  # 本应用的登录**恒为本地签发**——DefaultLoginHandler 校验本进程 sys_user 口令后
  # 直接 issueLocalToken()（TokenCipher/SM4）；学生侧 StudentCredentialProvider 同样
  # 用 CredentialIssuer -> TokenCipher.encrypt 本地签发。因此令牌只能由本进程校验：
  # protocol 必须是 static（StaticProtocol 用 TokenCipher.decryptToUser 本地解密校验）。
  # 若配成 tcp，AuthFilter 会把本地令牌送去独立部署的 oauth 服务端，而该服务端
  # 从未签发过它（Redis 查无此 token）-> 403「用户信息不存在/请重新登录」，页面表现为
  # 登录成功后列表全空。曾用 local-admin-fallback=true 掩盖该 403，实测后果是
  # 任何无令牌 / 伪造令牌的请求都被提升为内置 admin，可读写全部数据，故一并关闭。
  oauth:
    enable: true
    protocol: static
    # isFailure() 要求 loginAddress/auth-address 非空，留空会直接判鉴权失败
    address: tcp://192.168.50.198:19180
    auth-address: tcp://192.168.50.198:19180
    login-address: /#/login
    # TCP 链路不加密：服务端是否解密由请求头 x-oauth-encode 决定，
    # 而 TcpProtocol 不带该头（只有 HttpProtocol/RSocketProtocol 带），
    # 服务端因此按明文解析。若这里开着，body 会被 Codec.encodeHex 成 hex，
    # 服务端拿明文解析 hex 串 -> 解不出 x-oauth-username，
    # 实测报「登录失败: 密码错误 null」。
    enable-encryption: false
    token-name: x-oauth-token
    static-token-expire-seconds: 7200
    temp:
      # 格式 用户名:口令;用户名:口令；登录 /v2/user/login 走 static 自签
      #
      # [安全警告] 这里刻意留空，与 spring-support-ai-starter 保持同一口径。
      # 曾硬编码 admin123 / alice123 / bob123，等于把三个可登录的弱口令
      # 提交进版本库。现改为由部署方通过启动参数显式传入：
      #   --plugin.oauth.temp.user='<用户名>:<口令>'
      user: ""
    # 本地管理员兜底必须保持 false：该兜底等价于「鉴权失败即内置 admin」。
    # 实测（2026-10-18）：开启后垃圾令牌 THIS-IS-NOT-A-TOKEN 与**完全无令牌**的请求
    # 都能读到全部学生/班级，并能 POST classes/save 成功（越权写），因为内置 admin
    # userId="1" 恰好命中了 teacher_account='1' 的教师。令牌已能由 static 协议
    # 本地校验，无需兜底。
    local-admin-fallback: false
    # 不继承框架默认白名单（混有其它应用历史路径），按本应用显式放行
    use-default-whitelist: false
    whitelist:
      - /v2/user/login
      - /v2/user/logout
      - /v2/user/refresh-token
      - /v2/user/me
      - /**/captcha
      - /v3/api-docs/**
      - /doc.html
      - /webjars/**
      # Actuator 只放行 health（监控探活用）。其余端点（env / beans / configprops /
      # loggers / threaddump / mappings 等）刻意不在此列出，因此仍需经 AuthFilter 鉴权
      # —— 与「暴露面收窄」构成两道互补防线：即便将来有人把暴露面调回 '*'，
      # 未带有效令牌的请求仍会被 403 拦下，而不是直接可读可写。
      - /actuator/health
      - /login
      - /logout
      # 附件直链预览：iframe/img 无法带请求头，路径含随机 UUID + 扩展名白名单
      - /v2/edu/knowledge-point/file
      # 学生头像直链预览：同上 —— <img> 带不了 Authorization，必须放行；
      # 上传端点(/student-avatar/upload)仍在白名单之外，且带 @Permission("admin")。
      - /v2/edu/student-avatar/file
      # 登录页挂载时、以及登录成功后登录态落地前都会拉这份默认配置（loginByUsername 里的
      # refreshDefaultSetting）。它不带有效令牌，不放行就返回 403「用户信息不存在/请重新登录」，
      # 前端据此误判登录失效 → clearAllAuthData 清登录态 → 路由从 /home 弹回 /login，
      # 表现为「刚登录就又回登录页」。实测：补上后该接口 403 → 200，登录恢复正常。
      - /v2/setting/default
  # OSGi 源码扩展点：学生凭据校验等 SPI 实现改由源码声明，改完即生效，
  # 不必为调整一条登录规则重新构建 600MB+ 的 fat jar。
  # 源码目录刻意放在 jar 之外（WorkingDirectory 相对路径），fat jar 内的资源不可热改。
  osgi:
    source:
      enabled: true
      directory: ./osgi-source
      polling-interval: 5000
      groovy-enabled: true
      script-engine: groovy
  datasource:
    script:
      enable: true
      # 表结构脚本必须用 ALWAYS，原因有二（缺一不可）：
      # 1) filterSchemaScripts 在「ONCE + 库非空」时会把结构脚本全部跳过，
      #    存量库升级时新版本脚本根本不会被执行；
      # 2) 脚本文件名带版本号（V1.0__init_all_eduai.sql），升版后文件名变化、
      #    执行记录里查不到，才会真正执行；同一版本成功后 needsExecution() 会拦住，
      #    因此不是「每次启动都重跑 154 条语句」，而是「每个版本只跑一次」。
      # 之前用 ONCE + 固定 V1.0，导致新增的唯一索引在存量库上永不生效，
      # initdata 的 INSERT IGNORE 失去约束、每次重灌数据翻倍
      # （实测 edu_poem_grade 由 967 涨到 2901）。
      # 前提：init_all 脚本必须全幂等（已审计：154 条语句全部带 IF NOT EXISTS / OR IGNORE）。
      scan-mode: ALWAYS
      # 初始化数据仍保持 ONCE：种子脚本体积已达 1.1MB，且业务表非空即无需重灌。
      data-scan-mode: ONCE
      continue-on-error: true
      verbose: true
  queue:
    enable: true
    type: local
  job:
    enable: true
    role: SINGLE
    manage:
      enable: true
  eduai:
    marking:
      async: true
      # ONNX 卡片/布局矫正（card-correction-detector）：默认关闭，开启后先检测四边形并透视拉平，再走原有预处理/版面/OCR
      layout-correction: false

# AI 对话客户端不再由 YAML 声明：改由 AI 控制台 UI（落库 sys_ai_global_setting /
# sys_ai_manufacturer）统一配置，与本模块集成 ai-starter 的「配置页 + 生效 bean」口径一致。
# 依据：ai-starter 的 AiConfiguration.yamlChatClient 一旦存在（plugin.ai.chat.enabled=true 且
# app-key 非空）就会顶掉聚合客户端（defaultChatClient 带 @ConditionalOnMissingBean），
# 使 UI 配置（厂商/模型、`models.defaultChatModelId` 热更新）对 eduai 完全不可见。
# 现在客户端由 AiConfiguration 的聚合 bean + ChatClientRegistry 提供；eduai 侧
# EduAiService.resolveClient() 的取值顺序：runtime 主链路（provider/api_key/base_url/model）
# → registry 默认（UI「默认模型」热更新登记的客户端）→ 注入的聚合 bean。

logging:
  level:
    com.chua.starter.eduai: INFO
  file:
    name: ./logs/eduai.log

# ===========================================
# Actuator 暴露面（安全收紧）
# ===========================================
# 背景：框架的 DatabaseSettingEnvironmentPostProcessor 会把
# management.endpoints.web.exposure.include 作为「启动期默认设置」种进 sys_setting，
# 默认值是 "*" —— 即 env / beans / configprops / loggers / threaddump / mappings
# 全部无鉴权对外暴露。其中 /actuator/loggers 允许 POST 修改运行期日志级别，
# 可被用来刷 DEBUG 打满磁盘或关闭安全日志，属真实攻击面。
#
# 与白名单的关系：白名单放行在前（不放行则需鉴权），暴露面收窄在后（不暴露则 404）。
# 两者都做才是完整修复：只收窄暴露面，则一旦有人把 DB 里的设置调回 '*'，
# 漏洞立刻复现；只改白名单，则任何被放行的端点都无需鉴权。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 不对外暴露组件明细（DB / 磁盘等），避免信息泄露
      show-details: never
