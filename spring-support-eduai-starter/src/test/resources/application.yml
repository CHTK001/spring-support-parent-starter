# =====================================================================
# 测试用 application.yml：连接 172.16.0.40 的 MySQL，使用 eduai 库。
# 队列使用默认 chronicle-queue（本地磁盘，无需 Redis）。
# =====================================================================
server:
  port: 19095
  servlet:
    context-path: /

spring:
  application:
    name: vue-xx-eduai-xx
  datasource:
    url: jdbc:mysql://172.16.0.40:3306/eduai?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useUnicode=true&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: "root@"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init/*.sql
      continue-on-error: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

plugin:
  eduai:
    enabled: true
    ai:
      provider: chatglm
      timeout-ms: 30000
    marking:
      queue-name: edu.marking
      poll-interval-ms: 2000
    paper:
      max-questions: 30
  queue:
    type: local

logging:
  level:
    com.chua.starter.eduai: info
    com.chua.common.support.ai: warn
