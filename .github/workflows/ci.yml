name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 集成测试套件（spring-support-test-app：权限/数据权限/版本灰度/功能开关/攻击面/@DS/E2E）
      - name: Build & Test
        run: mvn -B -pl :spring-support-test-app -am test -DskipTests=false

      # JaCoCo 覆盖率报告（verify 阶段触发 report 目标）
      - name: JaCoCo Coverage
        run: mvn -B -pl :spring-support-test-app -am verify -DskipTests=false

      - uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: spring-support-test-app/target/surefire-reports

      - uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: spring-support-test-app/target/site/jacoco
