# 服务管理门禁：spring-support-filesystem-starter + spring-support-monitor-starter
#
# 覆盖范围（2026-10-01 起）：
#   - spring-support-filesystem-starter  FileStorageServerFilter 的 updateConfig 热更新语义
#   - spring-support-monitor-starter    file-storage 参数面一致性、ServerNodeRegistry 装配
#   - 连带 -am 依赖的 oauth-client / ai / datasource 等模块的既有测试一并跑
#
# 为什么单独建门禁（历史结论，勿删）：
#   本仓父 pom 的 skipTests 属性默认为真，只跑 mvn package 得到的 BUILD SUCCESS
#   不代表测试跑过——必须显式 -DskipTests=false，且以 "Tests run:" 的数字为准，
#   而不是 BUILD 结果。这两个模块在门禁建立前没有任何测试覆盖，
#   曾因此让「热更新无效」「参数不生效」两类缺陷长期无人察觉。
#
# 已踩过的坑（AGENTS.md 有完整记录，此处只列与本文件相关的）：
#   - paths 含 src/acceptance：改动验收脚本时必须触发本门禁（否则改门禁不触发门禁）
#     注意措辞：本 workflow **不执行**该验收脚本——它需要对运行中的后台做黑盒
#     验证，凭据来自 MS_SSH_PASS / MS_SSH_HOSTKEY 等环境变量，CI 里没有。
#     因此验收套件目前仍是**手工执行**，这是已知未覆盖面，不是本门禁的功劳。
#   - paths 含 .github/workflows 自身：只改 CI 定义的提交不触发任何检查，
#     CI 配置会未经检验就合入
#   - concurrency 的 group 含 event_name、cancel-in-progress 写成表达式，
#     使 workflow_dispatch 不被并发 push 取消
#   - 本仓 POM 把 surefire 的 argLine 写死，命令行 -DargLine 不生效；
#     需要给测试 JVM 传参数时必须改 enable.preview.jvm.args 属性
name: Monitor Gate

on:
  push:
    branches: [ main, master ]
    paths:
      - "**/src/main/**"
      - "**/src/test/**"
      - "**/src/acceptance/**"
      - "**/pom.xml"
      - ".github/workflows/**"
  pull_request:
    branches: [ main, master ]
    paths:
      - "**/src/main/**"
      - "**/src/test/**"
      - "**/src/acceptance/**"
      - "**/pom.xml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: monitor-gate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  TARGET_MODULES: >-
    spring-support-filesystem-starter,
    spring-support-monitor-starter

jobs:
  gate:
    name: Monitor Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      # utils-support-* 是独立仓、不在本仓 reactor 内，须从远端仓库解析。
      # 本仓 distributionManagement 指向 packages 阿里云私有库，需要账号密码；
      # 未配置 Secrets 时 CI 会在依赖解析阶段失败（属预期，不是门禁本身的问题）。
      - name: Configure Maven servers
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>2676178-release-jmLEdB</id>
                <username>${{ secrets.ALIYUN_PACKAGES_USERNAME }}</username>
                <password>${{ secrets.ALIYUN_PACKAGES_PASSWORD }}</password>
              </server>
              <server>
                <id>2676178-snapshot-FwAJpk</id>
                <username>${{ secrets.ALIYUN_PACKAGES_USERNAME }}</username>
                <password>${{ secrets.ALIYUN_PACKAGES_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Show toolchain
        run: |
          java -version
          mvn -v

      # 编译 + 跑测试。skipTests 必须显式关掉，否则父 pom 的默认真值会让测试整体跳过。
      # 只跑一次 mvn：结果落盘后由同一 step 核对 Tests run 汇总，
      # 避免重复执行把 CI 时长翻倍。
      - name: Run tests and assert they actually ran
        run: |
          set -o pipefail
          mkdir -p target
          LOG=target/monitor-gate.log
          mvn test \
            -pl "${{ env.TARGET_MODULES }}" \
            -am \
            -B \
            -DskipTests=false \
            -DfailIfNoTests=false \
            -Dspring-boot.repackage.skip=true 2>&1 | tee "$LOG"
          echo "----- per-module Tests run summary -----"
          grep -E '^\[INFO\] Tests run: [0-9]+, Failures' "$LOG" || true
          # 判据是「确实跑了多少个测试」，不是 BUILD SUCCESS。
          # 父 pom 默认跳过测试时同样 BUILD SUCCESS，一个都没跑到必须判失败，
          # 避免出现「绿灯但什么都没测」。
          TOTAL=$(grep -oE '^\[INFO\] Tests run: [0-9]+, Failures: 0, Errors: 0' "$LOG" \
                  | grep -oE 'Tests run: [0-9]+' \
                  | grep -oE '[0-9]+' \
                  | awk '{ s += $1 } END { print s + 0 }')
          echo "tests passed across modules = ${TOTAL}"
          if [ "${TOTAL}" -lt 1 ]; then
            echo "::error::门禁未跑到任何测试（父 pom 默认跳过测试时同样 BUILD SUCCESS），本门禁视为失败"
            exit 1
          fi