spring:
  main:
    banner-mode: off
  main.banner-mode: off

plugin:
  job:
    enable: true
    cluster:
      group: default
      scan-interval-ms: 200
      pre-read-ms: 1000
      lease-seconds: 60
    sync:
      scheduler:
        listen-host: 0.0.0.0
        listen-port: 8081
    pool:
      core-size: 2
      max-size: 4
      queue-size: 64

logging:
  level:
    root: WARN
    com.chua.starter.job: INFO
    com.chua.starter.job.support: INFO
