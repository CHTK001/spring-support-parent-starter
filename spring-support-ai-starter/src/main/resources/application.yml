server:
  port: 8080

spring:
  application:
    name: ai-starter
  autoconfigure:
    exclude:
      - com.chua.starter.datasource.configuration.ShardingSphereAutoConfiguration
      - com.chua.starter.datasource.configuration.DataSourceScriptConfiguration
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:aidb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      encoding: utf-8
  h2:
    console:
      enabled: true
      path: /h2-console
  profiles:
    active: dev
  ai:
    usage:
      enabled: false

rag:
  enabled: false

# 文件系统：目录浏览接口默认关闭，需显式开启（安全问题）
plugin:
  filesystem:
    enable: true
    dir-list: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
  mapper-locations: classpath*:mapper/**/*.xml
