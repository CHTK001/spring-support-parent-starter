server:
  port: 8091
  servlet:
    context-path: /api/ai

spring:
  application:
    name: ai-starter
  autoconfigure:
    exclude:
      - com.chua.starter.datasource.configuration.ShardingSphereAutoConfiguration
      - com.chua.starter.datasource.configuration.DataSourceScriptConfiguration
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:aidb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_UPPER=false
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      encoding: utf-8
  h2:
    console:
      enabled: false
      path: /h2-console
  profiles:
    active: dev
  ai:
    usage:
      enabled: true

# 文件系统：目录浏览接口默认关闭，需显式开启（安全问题）
plugin:
  filesystem:
    enable: true
    dir-list: false

# OAuth 客户端鉴权（管理端 @Permission("admin") 接口鉴权，对接外部 oauth 服务端）
  oauth:
    enable: true
    protocol: http
    address: http://172.16.0.40:19180/oauth
    auth-address: http://172.16.0.40:19180/oauth
    oauth-url: /verify
    # AI 协议端点（Bearer 为业务 AppKey，非 oauth token）与登录/健康检查放行
    whitelist:
      - /v2/v1/**
      - /provider/**
      - /v2/manufacturer/factories
      - /v2/global-settings
      - /v2/face/**

logging:
  level:
    com.chua.starter.oauth.client: debug

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
  mapper-locations: classpath*:mapper/**/*.xml
