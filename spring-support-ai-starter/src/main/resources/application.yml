server:
  # 8787 固定为 ai 前端运行模式时的固定端口，pages/ai index.html 注入 __backendPort
  port: 8787
  servlet:
    context-path: /

ai:
  skills-market-url: https://skillsmp.com/api/skills

spring:
  application:
    name: ai-starter
  autoconfigure:
    exclude:
      - com.chua.starter.datasource.configuration.ShardingSphereAutoConfiguration
      - com.chua.starter.datasource.configuration.DataSourceScriptConfiguration
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.16.0.40:3306/ai_test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root@
    hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 10000
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
      path: /h2-console
  data:
    redis:
      host: 172.16.0.40
      port: 6379
      # 无密码环境留空；有密码取消注释
      # password:
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  profiles:
    active: dev
  ai:
    usage:
      enabled: true

# 文件系统：目录浏览接口默认关闭，需显式开启（安全问题）
# OAuth 客户端鉴权（管理端 @Permission("admin") 接口鉴权，对接外部 oauth 服务端）
---
spring:
  config:
    activate:
      on-profile: "local"
plugin:
  oauth:
    enable: true
    protocol: static
    # 静态协议自校验令牌不外呼；loginAddress 只作为「未登录跳转地址」参与前置判断，
    # 留空会让 isFailure() 直接判为鉴权失败，故必须给出非空值
    auth-address: http://127.0.0.1:8787/login
    temp:
      # 格式 用户名:密码;用户名:密码；用户标识取用户名，跨登录稳定，数据按此归属
      user: "admin:admin123;alice:alice123;bob:bob123"
    # 框架内置默认白名单混有历史应用专用路径（/api/extensions/**、/v2/usage/** 等），
    # 本应用按自身路由显式放行，不继承
    use-default-whitelist: false
    whitelist:
      # OpenAI/Claude/Gemini 兼容协议：Bearer 是业务 AppKey，不是登录令牌
      - /v2/v1/**
      - /v2/v1beta/**
      # 桌面端 Bot 绑定与探活、WebSocket 握手、健康检查
      - /v2/ai/bot-binding/**
      - /ws
      - /actuator/**
  filesystem:
    enable: false
    dir-list: false
  datasource:
    script:
      validate-checksum: false

---
spring:
  config:
    activate:
      on-profile: "!local"
plugin:
  filesystem:
    enable: true
    dir-list: false
  oauth:
    enable: true
    protocol: http
    address: http://172.16.0.40:19180/oauth
    auth-address: http://172.16.0.40:19180/oauth
    oauth-url: /verify
    # 框架内置默认白名单含历史应用专用路径，本应用不继承
    use-default-whitelist: false
    whitelist:
      # AI 协议端点（Bearer 为业务 AppKey，非 oauth token）
      - /v2/v1/**
      - /v2/v1beta/**
      # 桌面端 Bot 绑定与探活、WebSocket 握手
      - /v2/ai/bot-binding/**
      - /ws
  account:
    register:
      enable: false
      yescaptcha-key: ""
      email-provider: fce
      replenish-interval-seconds: 3600

logging:
  level:
    com.chua.starter.oauth.client: debug

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
  mapper-locations: classpath*:mapper/**/*.xml