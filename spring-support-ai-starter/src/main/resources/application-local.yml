# 本地测试配置（H2 内存数据库 + db/init 脚本 + 关闭外部依赖）
# 启动方式：mvn -pl spring-support-ai-starter spring-boot:run -Dspring-boot.run.profiles=local
# 或打包后：java -jar spring-support-ai-starter-4.0.0.42.jar --spring.profiles.active=local
server:
  port: 8787
  servlet:
    context-path:

spring:
  application:
    name: ai-starter
  autoconfigure:
    exclude:
      - com.chua.starter.datasource.configuration.ShardingSphereAutoConfiguration
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration
  data:
    redis:
      host: 172.16.0.40
      port: 6379
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.16.0.40:3306/ai_test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: root@
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  sql:
    init:
      mode: never
  ai:
    usage:
      enabled: true
    generate:
      enabled: false
    rag:
      enabled: true
      vector-storage: memory
      embedding-engine: memory

# 本地联调：关闭外部 OAuth / 协议服务器 / 文件系统
plugin:
  oauth:
    enable: true
    protocol: static
    temp:
      open: true
      user: "admin"
    whitelist:
      - /login
      - /v2/user/login
      - /v2/user/logout
      - /api/system/info
      - /api/auth/status
      - /api/auth/user
      - /api/extensions/*
      - /api/terminals
      - /api/terminals/*
      - /api/**
      - /ws
  protocol:
    enable: false
  filesystem:
    enable: false
    dir-list: false
  datasource:
    script:
      enable: true
