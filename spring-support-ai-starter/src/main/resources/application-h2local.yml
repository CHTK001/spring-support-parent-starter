server:
  port: 8787

spring:
  application:
    name: ai-starter
  autoconfigure:
    exclude:
      - com.chua.starter.datasource.configuration.ShardingSphereAutoConfiguration
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  sql:
    init:
      mode: never
  data:
    redis:
      repositories:
        enabled: false

plugin:
  optional:
    enable: true
  oauth:
    enable: false
    protocol: static
    temp:
      open: true
      user: "admin:admin123"
    whitelist:
      - /**
    skip:
      enabled: true
  filesystem:
    enable: false
    dir-list: false
  datasource:
    script:
      validate-checksum: false
  cache:
    enable: false

nomifun:
  skills-root: "D:\\ch\\project\\spring-support-parent-starter\\spring-support-ai-starter\\skills"

logging:
  level:
    com.chua.starter.ai: info
    org.springframework: warn
