server:
  port: 8787

spring:
  application:
    name: ai-starter
  autoconfigure:
    exclude:
      - com.chua.starter.datasource.configuration.ShardingSphereAutoConfiguration
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/ai_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=KEY,VALUE,DELETE,GROUP
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2-local-schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      repositories:
        enabled: false

plugin:
  optional:
    enable: true
  oauth:
    enable: false
    protocol: static
    temp:
      open: true
      user: "admin:admin123"
    whitelist:
      - /**
    skip:
      enabled: true
  filesystem:
    enable: false
    dir-list: false
  datasource:
    script:
      validate-checksum: false
  cache:
    enable: false

nomifun:
  skills-root: "D:\\ch\\project\\spring-support-parent-starter\\spring-support-ai-starter\\skills"

logging:
  level:
    com.chua.starter.ai: info
    org.springframework: warn
