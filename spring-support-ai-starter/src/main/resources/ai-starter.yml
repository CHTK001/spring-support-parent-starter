# 本 jar 会被宿主以库依赖引入：文件名不能是 application.yml，否则类路径首匹配会整份替换宿主的配置。
# 仅由 AiStarterApplication 通过 spring.config.import 导入。
server:
  # 8787 固定为 ai 前端运行模式时的固定端口，pages/ai index.html 注入 __backendPort
  port: 8787
  servlet:
    context-path: /

ai:
  skills-market-url: https://skillsmp.com/api/skills

  # ==========================================================================
  # ONNX 本地推理供应商（yaml 侧；对应 sys_ai_provider 表 provider_id=onnx 的内置行，
  # 与其它供应商同构，只是地址与凭据语义是本机的）：
  #   * base-url  本地推理地址（默认指向本机推理服务）
  #   * api-key   ONNX 的 appkey 语义 = 本地模型目录（不是密钥）；页面未选择过目录时兜底
  #
  # 目录选择与持久化：页面「模型管理 → ONNX 本地推理 → 添加外部模型目录」按模型逐个绑定
  # （目录 + 模板模型），结果写入 sys_ai_global_setting 的 onnx.external_directories /
  # onnx.model_root；本配置项仅在库侧（页面）未选择过目录时兜底，两者需要保持一致。
  #
  # 模型目录布局（每模型一目录）：<模型目录>/<modelId>/model.onnx，
  # modelId 与下方「默认模型」逐模型配置的取值一一对应。
  # ==========================================================================
  onnx:
    base-url: http://127.0.0.1:8080/v1
    api-key: models/onnx

  # ==========================================================================
  # 默认模型配置（yaml 侧）
  #
  # 对应页面「系统配置 → 默认模型」。优先级：页面配置 > yaml。
  #   * 页面已保存的字段 → 生效值为页面值，本节被忽略
  #   * 页面为空的字段   → 生效值为本节对应值
  #
  # 用途：其它模块依赖 ai-starter 但自身没有配置页面时，可在此直接给出默认模型，
  #      并注入 DefaultModelResolver（全局 Bean）读取最终生效值，无需访问数据库。
  #
  # 取值格式二选一：
  #   model                 纯模型名
  #   providerId:model      带提供商前缀（同名模型消歧用），解析后同样取 model
  #
  # 全部留空 = 交由各能力的既有兜底逻辑处理（不启用对应能力）。
  # ==========================================================================
  default-model:
    # ── 对话类 ──
    chat: # 默认对话模型
    title-summary: # 默认标题总结模型
    visual-assistant: # 默认视觉辅助模型
    history-compression: # 默认历史压缩模型
    history-compression-prompt: # 默认历史压缩提示词
    translation: # 默认翻译模型
    translation-prompt: # 默认翻译提示词

    # ── 通用能力 ──
    feature: # 默认特征提取模型
    rag-embedding: # 默认 RAG 嵌入模型
    rerank: # 默认重排序模型

    # ── 图像 / 视频 ──
    text-to-image: # 默认文生图模型
    text-to-video: # 默认文生视频模型
    image-enhance: # 默认图像增强模型
    image-quality: # 默认图像质量评估模型
    image-classify: # 默认图像分类模型
    image-detect: # 默认目标检测模型
    image-segment: # 默认图像分割模型
    image-captioning: # 默认图像描述模型
    depth: # 默认深度估计模型

    # ── OCR ──
    # 逐模型单独配置，取值为 providerId:model（带提供商前缀，与页面「系统配置 → 默认模型 →
    # OCR 文字识别」保存的形态一致）。模型由 ONNX 供应商从服务器本地模型目录提供：
    # <模型目录>/<modelId>/model.onnx（页面值优先，本节为 yaml 兜底）。
    ocr-detect: onnx:paddleocrv6-det # 默认 OCR 文字检测模型（PaddleOCRv6 tiny 检测）
    ocr-recognize: onnx:paddleocrv6-rec # 默认 OCR 文字识别模型（PaddleOCRv6 tiny 识别）
    ocr-direction: onnx:doc-orientation # 默认 OCR 方向矫正模型
    ocr-super-resolution: # 默认 OCR 超分模型（未部署，留空）

    # ── 版面 ──
    layout: onnx:pp-doc-layout # 默认版面分析模型（PP-DocLayoutV3）

    # ── 人脸 ──
    face-detect: # 默认人脸检测模型
    face-recognize: # 默认人脸识别（特征）模型
    liveness: # 默认活体检测模型
    face-quality: # 默认人脸质量评估模型

    # ── 其它视觉 ──
    eye-detect: # 默认眼睛检测模型
    smile-detect: # 默认微笑检测模型
    pedestrian: # 默认行人检测模型

    # ── 车牌 ──
    plate-detect: # 默认车牌检测模型
    plate-recognize: # 默认车牌识别模型

spring:
  application:
    name: ai-starter
  autoconfigure:
    exclude:
      - com.chua.starter.datasource.configuration.ShardingSphereAutoConfiguration
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.16.0.40:3306/ai_test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ${AI_DB_PASSWORD:}
    hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 10000
  sql:
    init:
      mode: never
  data:
    redis:
      host: 172.16.0.40
      port: 6379
      # 无密码环境留空；有密码取消注释
      # password:
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  profiles:
    active: dev
  ai:
    usage:
      enabled: true

# ===========================================
# Actuator 暴露面（安全收紧）
# ===========================================
# 背景：框架的 DatabaseSettingEnvironmentPostProcessor 会把
# management.endpoints.web.exposure.include 作为「启动期默认设置」种进 sys_setting，
# 默认值是 "*" —— 即 env / beans / configprops / loggers / threaddump / mappings
# 全部对外暴露。其中 /actuator/loggers 允许 POST 修改运行期日志级别，
# 可被用来刷 DEBUG 打满磁盘或关闭安全日志，属真实攻击面。
#
# 与白名单的关系：白名单放行在前（不放行则需鉴权），暴露面收窄在后（不暴露则 404）。
# 两者都做才是完整修复：只收窄暴露面，则一旦有人把 DB 里的设置调回 '*'，
# 漏洞立刻复现；只改白名单，则任何被放行的端点都无需鉴权。
#
# 与 sys_setting 里那个 '*' 的优先级关系（改这段前先确认没被反超）：
# DatabaseSettingEnvironmentPostProcessor 找不到 ops- 前缀的属性源时走 addLast，
# 而本 jar 未打包 ops-default/application-actuator.yml，所以 sys_setting 的 '*'
# 优先级低于本文件，这里能盖住它。
# 一旦有人把 ops-default/application-actuator.yml 放进部署目录，DB 就会插到
# 前面反超这里 —— 届时必须同步把 sys_setting_group='startup-actuator' 里
# management.endpoints.web.exposure.include 的值改成 health,info。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 不对外暴露组件明细（DB / 磁盘等），避免信息泄露
      show-details: never

# 文件系统：目录浏览接口默认关闭，需显式开启（安全问题）
# OAuth 客户端鉴权（管理端 @Permission("admin") 接口鉴权，对接外部 oauth 服务端）
---
spring:
  config:
    activate:
      on-profile: "local"
plugin:
  api:
    cors:
      # 本地开发时前端由 vite dev server 提供，与后端 8787 不同源，
      # 浏览器会带上 Origin 并被 ApiCorsFilter 判为跨域而 403「Invalid CORS request」。
      # 不配置时过滤器只放行与后端同源的 Origin，因此开发态必须显式列出 vite 端口。
      # 该段仅在 local profile 生效，生产同源部署不受影响。
      allowed-origins:
        - http://localhost:15689
        - http://127.0.0.1:15689
        # 验收扫描专用实例，避免与并发的验收进程争抢 15689
        - http://localhost:15700
        - http://127.0.0.1:15700
    decode:
      # 开发/验收用 AES 密钥（与前端 app.yaml httpConfig.requestCodec.key 一致，
      # 后端对 key 做 SHA-256 → 32 字节 AES-256 密钥，IV 取前 16 字节）
      codec-type: aes
      codec-request-key: e3eccc79fe899fcd06b380126930d61c
  oauth:
    enable: true
    protocol: static
    # 静态协议自校验令牌不外呼；loginAddress 只作为「未登录跳转地址」参与前置判断，
    # 留空会让 isFailure() 直接判为鉴权失败，故必须给出非空值
    auth-address: http://127.0.0.1:8787/login
    # 拆除鉴权过滤器里的令牌硬要求：无法完成鉴权的请求（无令牌 / 令牌失效）
    # 直接注入内置 admin 身份放行。本地开发与浏览器验收专用，严禁对外环境开启。
    local-admin-fallback: true
    temp:
      # 格式 用户名:口令;用户名:口令；用户标识取用户名，跨登录稳定，数据按此归属
      #
      # [开发环境] 本地联调 / 浏览器验收所需的登录口令（仅在 --spring.profiles.active=local
      # 时生效；生产 by "on-profile: !local" 文档段由远程 OAuth 接管，此处不传世）
      user: "admin:admin123;simon:a12345678;sara:a12345678"
    # 框架内置默认白名单混有历史应用专用路径（/api/extensions/**、/v2/usage/** 等），
    # 本应用按自身路由显式放行，不继承
    use-default-whitelist: false
    whitelist:
      # OpenAI/Claude/Gemini 兼容协议：Bearer 是业务 AppKey，不是登录令牌
      - /v2/v1/**
      - /v2/v1beta/**
      # 桌面端 Bot 绑定与探活、WebSocket 握手
      - /v2/ai/bot-binding/**
      - /ws
      # 只放行健康检查供探活；其余 actuator 端点必须带登录令牌。
      # 曾整段放行 /actuator/**，等于把 env / beans / configprops / threaddump /
      # mappings / loggers 全部无鉴权公开——与 spring-support-eduai-starter 的
      # ApplicationConfigSecurityTest 要求的策略一致：只放行 /actuator/health。
      - /actuator/health
      # 角色头像通过 <img> 加载（不携带 Authorization 头），头像非敏感放行读取
      - /v2/characters/*/avatar
  filesystem:
    enable: false
    # ONNX 模型选择器需浏览服务器模型目录；该接口仅管理员可访问
    dir-list: true
  datasource:
    script:
      # 建表与种子数据统一由 datasource-starter 的 FlywayLike 机制执行，
      # 走 classpath*:db/init/*.sql 扫描（本模块的 V5.1__init_all_ai.sql /
      # V5.1__initdata_all_ai.sql 及其他模块 jar 里的脚本一并纳入）。
      enable: true
      # ALWAYS：表结构脚本每次启动都扫，是否真执行由 sys_database_version 的
      # 「脚本名+版本」执行记录决定（已成功过的不会重跑）；补列语句靠版本号递进
      # 让记录失效，从而在存量库上补齐缺失的列。
      scan-mode: ALWAYS
      # 种子数据仍保持 ONCE：业务表非空即无需重灌。
      data-scan-mode: ONCE
      continue-on-error: true
      verbose: true
      # 脚本内容会随版本迭代调整（补列语句并入 init），不校验历史 checksum。
      validate-checksum: false

---
spring:
  config:
    activate:
      on-profile: "!local"
plugin:
  # RPC（Dubbo 3.3.6）：把 AI 能力暴露为 RPC 接口；默认关闭，不松口暴露服务端口
  # 开启前需配注册中心地址与协议端口；消费方用 @RpcResource(version = "1.0.0") 注入，
  # rpc 不可用时自动熔断降级到本应用的本地 Bean（degrade = "springbean"）
  rpc:
    enable: false
    scan:
      - 'com.chua.starter.ai.support.rpc'
  filesystem:
    enable: true
    dir-list: false
    # 协同文档：内存态读写 + 定时整库落盘（防进程重启丢内容）
    # persist-path 缺省为 data/file-collab/collab-store.json（相对进程工作目录）
    collab:
      persist-enable: true
      persist-seconds: 30
  oauth:
    enable: true
    protocol: http
    address: http://172.16.0.40:19180/oauth
    auth-address: http://172.16.0.40:19180/oauth
    oauth-url: /verify
    # 框架内置默认白名单含历史应用专用路径，本应用不继承
    use-default-whitelist: false
    whitelist:
      # AI 协议端点（Bearer 为业务 AppKey，非 oauth token）
      - /v2/v1/**
      - /v2/v1beta/**
      # 桌面端 Bot 绑定与探活、WebSocket 握手
      - /v2/ai/bot-binding/**
      - /ws
      # 角色头像通过 <img> 加载，头像非敏感放行读取
      - /v2/characters/*/avatar
  account:
    register:
      enable: false
      yescaptcha-key: ""
      email-provider: fce
      replenish-interval-seconds: 3600

logging:
  level:
    com.chua.starter.oauth.client: debug

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
  mapper-locations: classpath*:mapper/**/*.xml
---
# 本地自测档：只连本机 MySQL/Redis，不外指 172.16.0.40
# 启动方式：mvn -pl spring-support-ai-starter spring-boot:run -Dspring-boot.run.profiles=local
# 或打包后：java -jar spring-support-ai-starter-<version>.jar --spring.profiles.active=local
spring:
  config:
    activate:
      on-profile: "local"
  application:
    name: ai-starter
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  autoconfigure:
    exclude:
      - com.chua.starter.datasource.configuration.ShardingSphereAutoConfiguration
      - com.chua.starter.filesystem.support.config.FileSystemAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.endpoint.web.servlet.WebMvcEndpointManagementContextConfiguration
      - com.chua.starter.datasource.configuration.DocumentAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_test?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ai
    password: ${AI_DB_PASSWORD:ai}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 15000
  sql:
    init:
      mode: never
  ai:
    usage:
      enabled: true
    generate:
      enabled: false
    rag:
      enabled: true
      vector-storage: jvector
      embedding-engine: memory
server:
  port: 8787
  servlet:
    context-path:

# 技能根目录：默认相对进程工作目录（不存在时由内置技能初始化器自建）。
# 内置技能每次启动都从 classpath 的 skills-builtin/ 与 characters-builtin/ 覆盖同步，
# 因此不依赖 CWD 布局，模块目录、部署目录、服务器上都能正常初始化。
# 部署环境如需固定位置，用环境变量 NOMIFUN_SKILLS_ROOT 覆盖，不要写死某台机器的绝对路径。
nomifun:
  skills-root: ${NOMIFUN_SKILLS_ROOT:./skills}
  # Agent 技能根目录：Agent 生态提供的离线技能统一存放处（默认用户主目录下的 .agents/skills）。
  # 角色目录不存在/无技能时扫描静默跳过；用环境变量 NOMIFUN_SKILLS_AGENT_ROOT 覆盖。
  skills-agent-root: ${NOMIFUN_SKILLS_AGENT_ROOT:~/.agents/skills}